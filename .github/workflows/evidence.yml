name: Evidence checks
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python analysis/audit_evidence.py --output /tmp/recorded_evidence.json
      - run: diff evidence/recorded_evidence.json /tmp/recorded_evidence.json
      - run: python -m compileall -q analysis
  periodic-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-audit.txt biopython
      - run: python -m unittest discover -s tests -v
